  - ai
  - browser
  - cliphist
  - fastfetch
  - greeter
  - hypr
  - hyprlock
  - kitty
  - menu
  - modes
  - noctalia
  - quickshell
  - rofi
  - screensaver
  - security
  - swaync
  - systemd
  - wallpaper
  - windows
  - wofi
  - xdg
  - zsh

stow_key_links:
  - target: "{{ admin_home }}/.zshrc"
    source: "{{ dotfiles_repo_path }}/zsh/.zshrc"
  - target: "{{ admin_home }}/.config/hypr/hyprland.lua"
    source: "{{ dotfiles_repo_path }}/hypr/.config/hypr/hyprland.lua"
  - target: "{{ admin_home }}/.config/quickshell/shell.qml"
    source: "{{ dotfiles_repo_path }}/quickshell/.config/quickshell/shell.qml"
  - target: "{{ admin_home }}/.config/kitty/kitty.conf"
    source: "{{ dotfiles_repo_path }}/kitty/.config/kitty/kitty.conf"
  - target: "{{ admin_home }}/.local/bin/desktop-mode"
    source: "{{ dotfiles_repo_path }}/modes/.local/bin/desktop-mode"
  - target: "{{ admin_home }}/.local/bin/ascii-screensaver"
    source: "{{ dotfiles_repo_path }}/screensaver/.local/bin/ascii-screensaver"
  - target: "{{ admin_home }}/.config/systemd/user/hypr-monitor-watch.service"
    source: "{{ dotfiles_repo_path }}/systemd/.config/systemd/user/hypr-monitor-watch.service"

wallhaven_dl_source: "{{ admin_home }}/Projects/wallhaven-tools/wallhaven-dl"
wallhaven_dl_link: "{{ admin_home }}/.local/bin/wallhaven-dl"

# fhlkfds/wallhaven-tools is a private repository, unlike the dotfiles, Oh My Zsh,
# Powerlevel10k, fzf-tab and qylock repositories that every other role clones on the
# target. A target-side clone is therefore not an option: there are no GitHub
# credentials on the workstation, and ssh_allow_agent_forwarding is false, so an
# SSH-URL clone cannot reach the private remote either. The controller already holds a
# checkout, so the downloader is copied from there onto the target instead.
# Override this if your checkout lives somewhere other than ~/Projects on the
# controller. Rollback: `rm ~/.local/bin/wallhaven-dl` and the copied source.
wallhaven_dl_controller_source: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/Projects/wallhaven-tools/wallhaven-dl

# Only used to bootstrap the dotfiles theme on a fresh box that has never run
# `theme set`; an existing theme choice always takes priority. This no longer
# feeds the login screen, which is themed by sddm_theme below, but the greeter
# role still runs `theme set` because nothing else in the playbook does, and
# skipping it would leave a fresh box with no theme rendered at all.
greeter_theme_slug: tokyo-night

# Login screen: https://github.com/Darkkal44/qylock (GPL-3.0), a collection of
# SDDM themes. Its installer is interactive (fzf pickers and read prompts), so
# the greeter role does what the script does instead of running it: copy
# themes/<name> into /usr/share/sddm/themes/ and point SDDM at it.
qylock_repo_url: https://github.com/Darkkal44/qylock.git
qylock_repo_version: main
qylock_repo_path: "{{ admin_home }}/builds/qylock"

# The upstream repository is about 1.1 GB because every theme carries its own
# video and image assets, so the role checks out only the selected theme with a
# sparse, blobless clone. That is roughly 25 MB on disk for this theme.
# Any directory name under the repository's themes/ works here, including a
# nested variant such as clockwork/orbital.
sddm_theme: star-rail

# Honkai: Star Rail expects DIN Next, which qylock cannot ship for copyright
# reasons, so no font/ directory exists for it upstream. The theme still works
# with a fallback font; the role prints where to drop the file to get the
# intended look. See the font table in qylock's README for other themes.
sddm_theme_font_note: DIN Next, saved as font.ttf

sddm_themes_dir: /usr/share/sddm/themes
# The same path qylock's own sddm.sh writes, so running that script by hand
# replaces this file instead of silently shadowing it.
sddm_conf_path: /etc/sddm.conf.d/theme.conf

# x11 needs xorg-server installed; wayland needs a compositor (weston above).
sddm_display_server: wayland

# Left empty on purpose so SDDM uses the compositor command compiled into the
# installed version, which is correct for that version. Set it only to override.
sddm_wayland_compositor_command: ""

oh_my_zsh_repo_url: https://github.com/ohmyzsh/ohmyzsh.git
powerlevel10k_repo_url: https://github.com/romkatv/powerlevel10k.git
fzf_tab_repo_url: https://github.com/Aloxaf/fzf-tab.git
ttfx_repo_url: https://github.com/omacom-io/ttfx
ttfx_git_rev: 7203e354498462064b7c0a89375051f65cf2ce99

fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5

# Example:
# ufw_lan_rules:
#   - { port: "1714:1764", proto: udp, from_ip: "192.168.1.0/24", comment: "KDE Connect LAN" }
ufw_lan_rules: []

# LocalSend's documented default port. TCP carries the file transfers and UDP
# carries multicast peer discovery, so both are opened: with UDP closed the app
# cannot find peers and every device has to be added by IP by hand.
localsend_port: 53317

# Deliberately restricted to the LAN ranges instead of any source address.
# LocalSend authenticates nothing beyond an in-app confirmation prompt, so the
# listener should not be reachable from untrusted networks the host joins.
# Set to [] to close the port again.
localsend_source_ranges:
  - 10.2.1.0/24
  - 192.168.1.0/24
