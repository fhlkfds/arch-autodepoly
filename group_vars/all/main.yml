---
admin_user: liam
admin_home: "/home/{{ admin_user }}"
admin_shell: /usr/bin/zsh

# Put these values in an encrypted vars file. An existing authorized_keys file
# is accepted when vault_liam_authorized_key is empty.
admin_password_hash: "{{ vault_liam_password_hash | default('') }}"
admin_authorized_key: "{{ vault_liam_authorized_key | default('') }}"

# Required before fail2ban can be enabled. Every entry is written into
# jail.local's ignoreip, so fail2ban will never ban these sources. IPv4
# addresses and CIDR ranges are both accepted.
# Override from group_vars/all/vault.yml (which wins, being loaded after this
# file) if you would rather not keep your network layout in a tracked file.
admin_ips:
  - 10.2.1.0/24
  - 192.168.1.1
  - 127.0.0.1
  - 192.168.1.0/24

# Used by the controller for fresh, non-multiplexed key-authentication checks.
# Leave the identity file empty to use the controller's SSH agent/default keys.
ssh_validation_host: >-
  {{ '127.0.0.1' if (ansible_connection | default('ssh')) == 'local'
     else (ansible_host | default(inventory_hostname)) }}
ssh_validation_identity_file: ""
ssh_allow_agent_forwarding: false

# This workstation runs no SSH server in its finished state. The ssh role still
# installs and validates the hardened sshd configuration during a run, and the
# final task of the final play then stops and disables sshd, so nothing listens
# on the SSH port afterwards.
# Consequences of the default: a remote `ansible-playbook` run still works once,
# because it travels over the sshd that is already up, but it cannot open a new
# connection afterwards. Re-enable at the console with
# `systemctl enable --now sshd`, or run with `-e ssh_enabled=true` to leave sshd
# running and keep its UFW allowance in place.
ssh_enabled: false

workstation_groups:
