---
- name: Fully upgrade Arch before installing packages
  block:
    - name: Refresh package databases and run pacman -Syu
      community.general.pacman:
        update_cache: true
        upgrade: true
      register: full_upgrade
      changed_when: (full_upgrade.packages | default([])) | length > 0
  rescue:
    - name: Confirm that the upgrade failed because of package signatures
      ansible.builtin.assert:
        that:
          - >-
            ((ansible_failed_result.msg | default('')) ~
             (ansible_failed_result.stdout | default('')) ~
             (ansible_failed_result.stderr | default(''))) is
            regex('(?i)(signature|keyring|unknown trust|invalid or corrupted package)')
        fail_msg: >-
          pacman -Syu failed for a reason unrelated to signatures; refusing a
          speculative keyring repair. Original failure: {{ ansible_failed_result }}

    - name: Refresh archlinux-keyring after a signature failure
      community.general.pacman:
        name: archlinux-keyring
        state: latest
        update_cache: true

    - name: Retry the full upgrade after refreshing the keyring
      community.general.pacman:
        update_cache: true
        upgrade: true
      register: full_upgrade_retry
      changed_when: (full_upgrade_retry.packages | default([])) | length > 0

- name: Install official packages derived from the dotfiles repository
  community.general.pacman:
    name: "{{ official_packages }}"
    state: present

# virt-manager connects to qemu:///system through libvirt's system socket. The
# packages do not enable that daemon, and the socket is restricted to root and
# the libvirt group. Configure both pieces here so a fresh login can use the
# connection without running virt-manager as root.
- name: Ensure the libvirt access group exists
  ansible.builtin.group:
    name: libvirt
    state: present

- name: Add the administrative user to the libvirt group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: libvirt
    append: true

# Supplementary groups are fixed at login. Refresh the Ansible connection so
# the verification below tests the same access virt-manager gets after login.
- name: Reconnect after adding libvirt group membership
  ansible.builtin.meta: reset_connection

- name: Enable and start the libvirt system daemon
  ansible.builtin.systemd_service:
    name: libvirtd.service
    enabled: true
    state: started

- name: Verify the system QEMU libvirt connection as the administrator
  ansible.builtin.command:
    argv: [virsh, -c, qemu:///system, uri]
  become_user: "{{ admin_user }}"
  register: libvirt_system_uri
  changed_when: false
  failed_when: >-
    libvirt_system_uri.rc != 0 or
    libvirt_system_uri.stdout | trim != 'qemu:///system'

# Install and run the Tailscale daemon, but do not authenticate this host. The
# tailnet login is device-specific and must remain an interactive user action.
- name: Enable and start the Tailscale daemon
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started

# opendoas ships no default configuration, and the stowed zsh dotfiles set
# `alias sudo='doas'` (dotfiles zsh/.zshrc), so without this file every
# interactive `sudo ...` on the host fails with
# "doas: doas is not enabled, /etc/doas.conf: No such file or directory".
# This lives in the packages role rather than users because the validate step
# needs /usr/bin/doas to exist, and installing opendoas earlier would mean
# fetching a package before the full `pacman -Syu` above completes.
#
# Security: this grants liam the same root access the sudoers rule already
# grants, no more. `persist` caches the authentication for a few minutes,
# mirroring sudo's timestamp behaviour. A password is still required.
# Rollback: `rm /etc/doas.conf`. Interactive `sudo` then breaks again, but
# Ansible's own become uses /usr/bin/sudo directly and is unaffected.
- name: Install the validated doas rule for liam
  ansible.builtin.copy:
    dest: /etc/doas.conf
    content: "permit persist {{ admin_user }} as root\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/bin/doas -C %s

- name: Check whether yay is already installed
  ansible.builtin.command:
    argv: [yay, --version]
  register: yay_precheck
  changed_when: false
  failed_when: false

- name: Create the user build directory
  ansible.builtin.file:
    path: "{{ admin_home }}/builds"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Build yay as liam when it is absent
  when: yay_precheck.rc != 0
  block:
    - name: Clone the yay AUR packaging repository as liam
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay.git
        dest: "{{ admin_home }}/builds/yay"
        version: master
        update: true
        force: false
      become_user: "{{ admin_user }}"

    # makepkg refuses root. This narrowly scoped, temporary rule lets makepkg
    # invoke pacman; the always block removes it even if the build fails.
    - name: Grant temporary non-interactive pacman access for the yay build
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}-makepkg"
        content: "{{ admin_user }} ALL=(root) NOPASSWD: /usr/bin/pacman\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Run makepkg -si for yay as liam
      ansible.builtin.command:
        argv: [makepkg, -si, --noconfirm]
        chdir: "{{ admin_home }}/builds/yay"
      become_user: "{{ admin_user }}"
      environment:
        HOME: "{{ admin_home }}"
        # AUR packages can run npm/Vitest during makepkg. Keep their output
        # plain so Ansible failure JSON never exposes serialized ANSI escapes.
        NO_COLOR: "1"
        FORCE_COLOR: "0"
        CLICOLOR: "0"
        CLICOLOR_FORCE: "0"
        TERM: dumb
        CI: "true"
  always:
    # Rollback: deleting this file removes the temporary passwordless pacman
    # grant without changing the permanent sudo policy.
    - name: Remove temporary makepkg sudo access
      ansible.builtin.file:
        path: "/etc/sudoers.d/{{ admin_user }}-makepkg"
        state: absent

- name: Verify yay is installed
  ansible.builtin.command:
    argv: [yay, --version]
  register: yay_version_output
  changed_when: false

- name: Find missing AUR packages
  ansible.builtin.command:
    argv: [pacman, -Q, "{{ item }}"]
  loop: "{{ aur_packages }}"
  register: aur_package_queries
  changed_when: false
  failed_when: false

- name: Record missing AUR packages
  ansible.builtin.set_fact:
    missing_aur_packages: >-
      {{ aur_package_queries.results
         | selectattr('rc', 'ne', 0)
         | map(attribute='item')
         | list }}

- name: Build the native argv list for yay AUR installs
  ansible.builtin.set_fact:
    aur_yay_install_argv:
      - yay
      - -S
      - --needed
      - --noconfirm
      - --answerclean
      - None
      - --answerdiff
      - None

# The AUR is third-party, so every requested package now ends this chain in
# exactly one of three outcomes rather than pass/fail:
#   INSTALLED         the batch install, or a later individual retry, succeeded.
#   RETRYABLE_FAILURE yay never finished its agreed number of attempts (module
#                     error, lost become, missing yay). That is a host or
#                     controller problem, not upstream breakage, so it still
#                     stops the run via the assert below.
#   UPSTREAM_BROKEN   yay ran its whole retry budget and the package still will
#                     not build. Recorded in aur_skipped_packages, reported
#                     loudly after this block, and the play continues.
# Rollback: set aur_fail_hard=true (roles/packages/defaults/main.yml) to restore
# the old behaviour where any uninstallable AUR package halts provisioning.
- name: Initialise the AUR installation outcome facts
  ansible.builtin.set_fact:
    aur_installed_packages: []
    aur_retryable_failed_packages: []
    aur_skipped_packages: []

# This block deliberately carries no `when:`. A block-level condition is
# inherited by its `always` section too, so gating the block would let a stale
# sudoers grant from an interrupted earlier run survive any run that happened to
# have nothing to install. The install tasks carry the condition individually,
# which makes the privilege cleanup in `always` unconditional by construction
# instead of by luck. Removing an absent file is a no-op, so this stays
# idempotent.
- name: Install detected AUR packages with yay
  block:
    # Rollback: this grant is removed in the always block. It is limited to
    # pacman because yay itself must run unprivileged.
    - name: Grant temporary non-interactive pacman access for yay
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}-yay"
        content: "{{ admin_user }} ALL=(root) NOPASSWD: /usr/bin/pacman\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      when: missing_aur_packages | length > 0

    - name: >-
        Batch-install detected AUR packages: brave-bin, claude-code,
        helium-browser-bin, hermes-agent-desktop, hyprvoice-bin, localsend-bin,
        looking-glass, mpvpaper, pokemon-colorscripts-git, t3code-bin,
        wl-screenrec-git, and xdg-terminal-exec
      # 2026-09-06: t3-code-git was dropped because its upstream HEAD build
      # fails at Bun's frozen-lockfile check. t3code-bin is the upstream-
      # maintained prebuilt package and avoids that broken source-build path.
      ansible.builtin.command:
        # argv stays a native list; do not turn it into an interpolated command
        # string, which can corrupt module arguments and cause JSON warnings.
        argv: "{{ aur_yay_install_argv + missing_aur_packages }}"
      become_user: "{{ admin_user }}"
      environment:
        HOME: "{{ admin_home }}"
        # Rollback: remove these environment values to restore the AUR
        # builder's normal terminal formatting; they do not change host state.
        NO_COLOR: "1"
        FORCE_COLOR: "0"
        CLICOLOR: "0"
        CLICOLOR_FORCE: "0"
        TERM: dumb
        CI: "true"
      register: aur_batch_install
      changed_when: aur_batch_install.rc == 0
      failed_when: false
      when: missing_aur_packages | length > 0

    # One batch failure fails the whole yay invocation, so every missing package
    # is retried alone to find out which ones are actually broken. The argv is
    # the same list the batch uses, so a retry is the same operation in
    # isolation. `failed_when: false` also suppresses this loop's own "ran out
    # of retries" failure, which is what lets an unbuildable package leave the
    # task `ok` and be classified below instead of aborting the play.
    - name: Retry each AUR package individually after a failed batch
      ansible.builtin.command:
        argv: "{{ aur_yay_install_argv + [item] }}"
      become_user: "{{ admin_user }}"
      environment:
        HOME: "{{ admin_home }}"
        NO_COLOR: "1"
        FORCE_COLOR: "0"
        CLICOLOR: "0"
        CLICOLOR_FORCE: "0"
        TERM: dumb
        CI: "true"
      loop: "{{ missing_aur_packages }}"
      loop_control:
        label: "{{ item }}"
      register: aur_individual_install
      # `| default(1)` matters: a module-level failure (missing yay, lost
      # become) returns no rc at all, and a bare `.rc` reference would raise a
      # conditional error and divert the run into the rescue path instead of
      # letting the classification below name the package and the reason.
      until: aur_individual_install.rc | default(1) == 0
      retries: "{{ aur_install_retries | int }}"
      delay: "{{ aur_install_retry_delay | int }}"
      changed_when: aur_individual_install.rc | default(1) == 0
      failed_when: false
      when: aur_batch_install.rc | default(0) != 0

    # A skipped loop item carries no `rc`, so the shape filters drop it. Whether
    # `attempts` reached the retry budget is what separates "yay tried this the
    # agreed number of times and it still will not build" (UPSTREAM_BROKEN) from
    # "something stopped us before those attempts finished" (RETRYABLE_FAILURE).
    - name: Classify every requested AUR package into one outcome
      vars:
        aur_attempted: >-
          {{ aur_individual_install.results | default([])
             | rejectattr('skipped', 'defined') | list }}
        aur_retry_succeeded: >-
          {{ aur_attempted | selectattr('rc', 'defined')
             | selectattr('rc', 'eq', 0) | map(attribute='item') | list }}
        aur_retry_exhausted: >-
          {{ aur_attempted | selectattr('rc', 'defined')
             | selectattr('rc', 'ne', 0)
             | selectattr('attempts', 'defined')
             | selectattr('attempts', 'ge', aur_install_retries | int)
             | map(attribute='item') | list }}
      ansible.builtin.set_fact:
        aur_installed_packages: >-
          {{ missing_aur_packages if (aur_batch_install.rc | default(1)) == 0
             else aur_retry_succeeded }}
        aur_skipped_packages: "{{ aur_retry_exhausted }}"
        aur_retryable_failed_packages: >-
          {{ aur_attempted | map(attribute='item') | list
             | difference(aur_retry_succeeded)
             | difference(aur_retry_exhausted) }}

    # Deliberately asserts against the retryable list only. UPSTREAM_BROKEN
    # packages are reported and skipped after this block, because no change here
    # can make a broken PKGBUILD build and the rest of provisioning is unrelated.
    - name: Assert no AUR package failed before its retries were spent
      ansible.builtin.assert:
        that:
          - aur_retryable_failed_packages | length == 0
        fail_msg: >-
          yay never finished {{ aur_install_retries }} attempts for:
          {{ aur_retryable_failed_packages | join(', ') }}. That points at this
          host or the controller rather than upstream AUR breakage, so
          provisioning stopped instead of skipping the packages. The temporary
          pacman sudoers rule has still been removed.

  rescue:
    - name: Report the unexpected AUR failure before cleanup
      ansible.builtin.debug:
        msg: >-
          The AUR installation block failed outside the three-outcome
          classification: {{ ansible_failed_result.msg | default('no message') }}
          Batch rc={{ aur_batch_install.rc | default('not reached') }},
          retryable={{ aur_retryable_failed_packages | default([]) | join(', ') | default('none', true) }},
          skipped={{ aur_skipped_packages | default([]) | join(', ') | default('none', true) }}.
          The temporary pacman sudoers rule will still be removed.

    - name: Stop after an unexpected AUR installation failure
      ansible.builtin.fail:
        msg: >-
          {{ 'AUR packages failed before their retries were spent: ' ~
             (aur_retryable_failed_packages | join(', ')) ~ '.'
             if (aur_retryable_failed_packages | default([]) | length > 0)
             else 'AUR installation did not complete due to an Ansible module error.' }}
  always:
    # Rollback: remove the temporary privilege immediately, including on error.
    - name: Remove temporary yay sudo access
      ansible.builtin.file:
        path: "/etc/sudoers.d/{{ admin_user }}-yay"
        state: absent

# Runs after the block so the temporary privilege is already gone before the run
# either reports or stops on skipped packages.
- name: Summarise the AUR installation outcomes
  ansible.builtin.debug:
    msg:
      installed_this_run: "{{ aur_installed_packages | sort }}"
      already_present: "{{ aur_packages | difference(missing_aur_packages) | sort }}"
      skipped_upstream_broken: "{{ aur_skipped_packages | sort }}"
      failed_before_retries_were_spent: "{{ aur_retryable_failed_packages | sort }}"

- name: Report the skipped AUR packages so nothing is silently missing
  ansible.builtin.debug:
    msg: >-
      {{ ['*** ' ~ (aur_skipped_packages | length) ~ ' AUR PACKAGE(S) SKIPPED - PROVISIONING CONTINUED WITHOUT THEM ***']
         + (aur_skipped_packages | map('regex_replace', '^(.+)$', '  \1: retries exhausted (' ~ (aur_install_retries | int) ~ ' failed yay attempts); the PKGBUILD does not build on this host. Install it later with: yay -S \1') | list)
         + ['Every other requested AUR package is installed. Re-run this role once upstream is fixed, or set aur_fail_hard=true to make this fatal instead.'] }}
  when: aur_skipped_packages | length > 0

- name: Stop when aur_fail_hard requires every requested AUR package
  ansible.builtin.fail:
    msg: >-
      aur_fail_hard is set and these AUR packages did not install after
      {{ aur_install_retries }} attempts each:
      {{ aur_skipped_packages | join(', ') }}. Run `yay -S <package>` by hand to
      see the upstream build error, or leave aur_fail_hard at its default of
      false to provision without them.
  when:
    - aur_fail_hard | bool
    - aur_skipped_packages | length > 0

- name: Clone Oh My Zsh as documented by the dotfiles repository
  ansible.builtin.git:
    repo: "{{ oh_my_zsh_repo_url }}"
    dest: "{{ admin_home }}/.oh-my-zsh"
    version: master
    depth: 1
    update: true
    force: false
  become_user: "{{ admin_user }}"

- name: Clone Powerlevel10k into the Oh My Zsh custom theme directory
  ansible.builtin.git:
    repo: "{{ powerlevel10k_repo_url }}"
    dest: "{{ admin_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
    version: master
    depth: 1
    update: true
    force: false
  become_user: "{{ admin_user }}"

- name: Clone fzf-tab into the Oh My Zsh custom plugin directory
  ansible.builtin.git:
    repo: "{{ fzf_tab_repo_url }}"
    dest: "{{ admin_home }}/.oh-my-zsh/custom/plugins/fzf-tab"
    version: master
    depth: 1
    update: true
    force: false
  become_user: "{{ admin_user }}"

- name: Ensure the standard XDG user directories exist (Desktop, Documents, Downloads, Pictures, Videos, ...)
  ansible.builtin.command:
    argv: [xdg-user-dirs-update]
  become_user: "{{ admin_user }}"
  environment:
    HOME: "{{ admin_home }}"
  args:
    creates: "{{ admin_home }}/.config/user-dirs.dirs"

- name: Ensure the user-local executable directory exists
  ansible.builtin.file:
    path: "{{ admin_home }}/.local/bin"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

# wallhaven-tools is private, so this is the one external source the target cannot
# clone for itself; it is copied from the controller's checkout instead. See the
# wallhaven_dl_controller_source comment in group_vars/all/main.yml for why.
- name: Check for the wallhaven downloader source on the controller
  ansible.builtin.stat:
    path: "{{ wallhaven_dl_controller_source }}"
  register: wallhaven_dl_source_stat
  delegate_to: localhost
  become: false

- name: Require the wallhaven downloader source checkout on the controller
  ansible.builtin.assert:
    that:
      - wallhaven_dl_source_stat.stat.isreg | default(false)
      - wallhaven_dl_source_stat.stat.executable | default(false)
    fail_msg: >-
      {{ wallhaven_dl_controller_source }} must exist on the controller and be
      executable before it can be copied to {{ wallhaven_dl_source }} and linked.
      fhlkfds/wallhaven-tools is a private repository, so the target cannot clone
      it: check the repository out on the controller, or set
      wallhaven_dl_controller_source to wherever your checkout lives.

- name: Ensure the wallhaven downloader directory exists
  ansible.builtin.file:
    path: "{{ wallhaven_dl_source | dirname }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

# Mode is set explicitly rather than inherited: the link below is only worth
# creating over a file the shell can actually execute.
- name: Copy the wallhaven downloader from the controller checkout
  ansible.builtin.copy:
    src: "{{ wallhaven_dl_controller_source }}"
    dest: "{{ wallhaven_dl_source }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Link wallhaven-dl into the user-local executable directory
  ansible.builtin.file:
    src: "{{ wallhaven_dl_source }}"
    dest: "{{ wallhaven_dl_link }}"
    state: link
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    force: false

- name: Probe the repository-documented ttfx static binary
  ansible.builtin.command:
    argv: [file, "{{ admin_home }}/.local/bin/ttfx"]
  register: ttfx_probe
  changed_when: false
  failed_when: false

- name: Build ttfx from its documented Git source as liam
  ansible.builtin.command:
    argv:
      - cargo
      - install
      - --locked
      - --root
      - "{{ admin_home }}/.local"
      - --target
      - x86_64-unknown-linux-musl
      - --git
      - "{{ ttfx_repo_url }}"
      - --rev
      - "{{ ttfx_git_rev }}"
      - ttfx
  become_user: "{{ admin_user }}"
  environment:
    HOME: "{{ admin_home }}"
  when: >-
    ttfx_probe.rc != 0 or
    ttfx_probe.stdout is not regex('statically linked|static-pie linked')

- name: Verify the ttfx static binary
  ansible.builtin.command:
    argv: [file, "{{ admin_home }}/.local/bin/ttfx"]
  register: ttfx_verify_output
  changed_when: false
  failed_when: >-
    ttfx_verify_output.rc != 0 or
    ttfx_verify_output.stdout is not regex('statically linked|static-pie linked')

# A full `pacman -Syu` above may replace the kernel, which deletes
# /usr/lib/modules/<running release> and installs the new one. The running
# kernel then cannot modprobe anything: nft_chain_nat and nft_compat vanish,
# nftables netlink calls fail with EINVAL, and Docker cannot build its NAT
# chain. Every role after this one depends on that module tree, so reboot here
# rather than letting the docker role stop a half-provisioned host.
# Rollback: delete these three tasks. Provisioning then fails at the docker
# kernel guard whenever an upgrade replaced the kernel, and you reboot and
# rerun by hand.
- name: Read the running kernel release after the full upgrade
  ansible.builtin.command:
    argv: [uname, -r]
  register: packages_running_kernel
  changed_when: false

- name: Check whether the running kernel kept its module tree
  ansible.builtin.stat:
    path: "/usr/lib/modules/{{ packages_running_kernel.stdout }}"
  register: packages_running_kernel_modules

# The module's default readiness probe is `whoami`, which passes the instant
# sshd answers. /home is its own btrfs subvolume here (subvol=/@home in
# /etc/fstab) and sshd accepts connections before local-fs.target has mounted
# it, so Ansible reconnects into a host with no /home/liam, cannot create
# ~/.ansible/tmp, and the next task dies with "Could not chdir to home
# directory". Wait for every fstab mount to settle, then confirm the home
# directory is really there before handing control back.
- name: Reboot into the newly installed kernel
  ansible.builtin.reboot:
    reboot_timeout: 600
    post_reboot_delay: 5
    test_command: >-
      systemctl is-active --quiet local-fs.target &&
      test -d {{ admin_home | quote }}
    msg: Ansible is rebooting this host into the kernel it just installed.
  when: not (packages_running_kernel_modules.stat.isdir | default(false))

- name: Re-read the running kernel release after any reboot
  ansible.builtin.command:
    argv: [uname, -r]
  register: packages_kernel_after_reboot
  changed_when: false

- name: Confirm the running kernel now has its module tree
  ansible.builtin.stat:
    path: "/usr/lib/modules/{{ packages_kernel_after_reboot.stdout }}"
  register: packages_modules_after_reboot

- name: Require a usable module tree before any later role runs
  ansible.builtin.assert:
    that:
      - packages_modules_after_reboot.stat.isdir | default(false)
    fail_msg: >-
      The running kernel ({{ packages_kernel_after_reboot.stdout }}) still has
      no module tree in /usr/lib/modules after the reboot step. The host booted
      an unexpected kernel; check the bootloader entry and initramfs before
      rerunning. No Docker or firewall state has been changed.
