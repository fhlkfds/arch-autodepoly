---
- name: Install Docker Engine, Compose, and Buildx
  community.general.pacman:
    name: "{{ docker_packages }}"
    state: present

- name: Read the running kernel release before Docker networking is enabled
  ansible.builtin.command:
    argv: [uname, -r]
  register: docker_running_kernel
  changed_when: false

- name: Check that modules exist for the running kernel
  ansible.builtin.stat:
    path: "/usr/lib/modules/{{ docker_running_kernel.stdout }}"
  register: docker_running_kernel_modules

- name: Require a reboot when an upgrade replaced the running kernel modules
  ansible.builtin.assert:
    that:
      - docker_running_kernel_modules.stat.isdir | default(false)
    fail_msg: >-
      Docker provisioning stopped before changing Docker state because the
      running kernel ({{ docker_running_kernel.stdout }}) has no matching
      module tree. A full Arch upgrade replaced the kernel modules. Reboot the
      host, then rerun this playbook with --tags docker.

- name: Verify the nftables control plane before Docker creates NAT rules
  ansible.builtin.command:
    argv: [nft, list, ruleset]
  register: docker_nftables_probe
  changed_when: false
  failed_when: false

- name: Require a working nftables control plane for Docker networking
  ansible.builtin.assert:
    that:
      - docker_nftables_probe.rc == 0
    fail_msg: >-
      Docker provisioning stopped before enabling docker.service because
      nftables is not usable on this host: {{ docker_nftables_probe.stderr |
      default(docker_nftables_probe.stdout, true) }}. Reboot after a kernel
      upgrade and rerun. If this persists after reboot, repair the host's
      kernel/nftables installation; do not disable Docker iptables support.

- name: Ensure the docker group exists
  ansible.builtin.group:
    name: docker
    state: present

# Security: docker group members are effectively root. This is acceptable for
# this personal workstation; remove the membership on a reused multi-user host.
# Rollback: `gpasswd -d liam docker`, then log out all liam sessions.
- name: Add liam to the root-equivalent docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started

- name: Verify Docker is reachable by liam without sudo
  ansible.builtin.command:
    argv: [runuser, --user, "{{ admin_user }}", --, docker, info]
  environment:
    HOME: "{{ admin_home }}"
  register: docker_info_output
  changed_when: false

- name: Run the Docker hello-world smoke test as liam
  ansible.builtin.command:
    argv: [runuser, --user, "{{ admin_user }}", --, docker, run, --rm, hello-world]
  environment:
    HOME: "{{ admin_home }}"
  register: docker_hello_output
  changed_when: false
