---
# Wires up the themed greetd + regreet login screen documented in the
# dotfiles repo (system/greetd/, greeter/.config/greeter/README.md). Runs
# after packages (needs greetd-regreet and the greeter system user it
# creates) and dotfiles (needs hypr + greeter stowed and the theme
# generator available).

# The official hyprland package ships both hyprland.desktop (Exec=/usr/bin/
# start-hyprland, what this repo's session actually uses) and
# hyprland-uwsm.desktop, both registering DesktopNames=Hyprland with the same
# display name to greeters. That ambiguity is what makes tuigreet/regreet
# default to "Hyprland (uwsm-managed)" instead of the plain session. Nothing
# in this repo or the dotfiles repo uses uwsm, so keep only the plain entry
# visible. Renamed, not deleted, so it comes back cleanly if ever wanted; a
# `hyprland` package upgrade can restore the original file, which is why this
# runs every time rather than only once.
- name: Check whether the uwsm-managed Hyprland session entry is present
  ansible.builtin.stat:
    path: /usr/share/wayland-sessions/hyprland-uwsm.desktop
  register: greeter_uwsm_session

- name: Hide the uwsm-managed Hyprland session so greeters default to plain Hyprland
  ansible.builtin.command:
    argv:
      - mv
      - --
      - /usr/share/wayland-sessions/hyprland-uwsm.desktop
      - /usr/share/wayland-sessions/hyprland-uwsm.desktop.disabled
  when: greeter_uwsm_session.stat.exists

- name: Read the currently active theme slug, if any
  ansible.builtin.command:
    argv: ["{{ admin_home }}/.local/bin/theme", current]
  become_user: "{{ admin_user }}"
  environment:
    HOME: "{{ admin_home }}"
  register: greeter_current_theme
  changed_when: false
  failed_when: false

- name: Check whether the themed greeter files have been rendered yet
  ansible.builtin.stat:
    path: "{{ admin_home }}/.config/greeter/regreet.toml"
  register: greeter_theme_files

# Preserves an existing theme choice; only falls back to greeter_theme_slug
# on a fresh box where `theme set` has never run.
- name: Render the themed greeter files
  ansible.builtin.command:
    argv:
      - "{{ admin_home }}/.local/bin/theme"
      - set
      - "{{ (greeter_current_theme.stdout | trim) if (greeter_current_theme.stdout | trim | length > 0) else greeter_theme_slug }}"
  become_user: "{{ admin_user }}"
  environment:
    HOME: "{{ admin_home }}"
  when: not greeter_theme_files.stat.exists

- name: Install the themed greeter stylesheet into /etc/greetd
  ansible.builtin.copy:
    src: "{{ admin_home }}/.config/greeter/greeter.css"
    dest: /etc/greetd/regreet.css
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  register: greeter_css_deployed

- name: Install the themed greeter config into /etc/greetd
  ansible.builtin.copy:
    src: "{{ admin_home }}/.config/greeter/regreet.toml"
    dest: /etc/greetd/regreet.toml
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  register: greeter_toml_deployed

# greetd runs the greeter's Hyprland instance as the dedicated `greeter`
# system user, whose home is `/`, not liam's -- grant just enough ACL
# traversal to reach the one stowed config file. Mirrors the manual
# recipe in greeter/.config/greeter/README.md.
- name: Grant the greeter system user traversal access through the home directory
  ansible.posix.acl:
    path: "{{ item }}"
    entity: "{{ greeter_service_user }}"
    etype: user
    permissions: x
    state: present
  loop:
    - "{{ admin_home }}"
    - "{{ admin_home }}/.config"
    - "{{ admin_home }}/.config/hypr"
    - "{{ admin_home }}/.config/hypr/conf"

- name: Grant the greeter system user read+execute on the greeter conf directory
  ansible.posix.acl:
    path: "{{ admin_home }}/.config/hypr/conf/greeter"
    entity: "{{ greeter_service_user }}"
    etype: user
    permissions: rx
    state: present

- name: Grant the greeter system user read access to the greeter Hyprland config
  ansible.posix.acl:
    path: "{{ admin_home }}/.config/hypr/conf/greeter/hyprland-greeter.conf"
    entity: "{{ greeter_service_user }}"
    etype: user
    permissions: r
    state: present

- name: Check for an existing greetd session config
  ansible.builtin.stat:
    path: /etc/greetd/config.toml
  register: greeter_existing_config

# force: false means "only copy if the destination is absent", so a backup
# made on an earlier run is never clobbered -- same rule system/greetd/install.sh
# uses in the dotfiles repo.
- name: Preserve the pre-regreet greetd config on first deploy
  ansible.builtin.copy:
    src: /etc/greetd/config.toml
    dest: /etc/greetd/config.toml.pre-regreet
    remote_src: true
    force: false
    owner: root
    group: root
    mode: preserve
  when: greeter_existing_config.stat.exists

- name: Install the repository's greetd session config
  ansible.builtin.copy:
    src: "{{ dotfiles_repo_path }}/system/greetd/config.toml"
    dest: /etc/greetd/config.toml
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  register: greeter_config_deployed

- name: Note whether any greeter-facing file changed this run
  ansible.builtin.set_fact:
    greeter_config_changed: >-
      {{ greeter_config_deployed.changed
         or greeter_css_deployed.changed
         or greeter_toml_deployed.changed }}

# state: started is a no-op when greetd is already running, so .changed here
# means "greetd was not already running" -- i.e. this is the first time the
# login screen is coming up, which is exactly when it is safe to start it
# with the new config already in place.
- name: Enable and start greetd as the display manager
  ansible.builtin.systemd_service:
    name: greetd.service
    enabled: true
    state: started
  register: greeter_service

- name: Warn that a live greeter needs a manual restart to pick up new config
  ansible.builtin.debug:
    msg: >-
      /etc/greetd/config.toml, regreet.css, or regreet.toml changed, and
      greetd was already running before this play. Restarting it now could
      kill an active login session on its VT, so this play does not do that
      automatically. Apply the change at the next reboot, or run
      `sudo systemctl restart greetd` yourself from a TTY you are not
      currently using.
  when:
    - greeter_config_changed
    - not greeter_service.changed
