---
- name: Read final liam identity
  ansible.builtin.command:
    argv: [id, "{{ admin_user }}"]
  register: verify_id
  changed_when: false

- name: Validate the final sudoers configuration
  ansible.builtin.command:
    argv: [visudo, -cf, /etc/sudoers]
  register: verify_sudoers
  changed_when: false

- name: Read the managed sudoers rule
  ansible.builtin.command:
    argv: [cat, "/etc/sudoers.d/{{ admin_user }}"]
  register: verify_sudoers_content
  changed_when: false

- name: Validate the final doas configuration
  ansible.builtin.command:
    argv: [doas, -C, /etc/doas.conf]
  register: verify_doas
  changed_when: false

- name: Read the managed doas rule
  ansible.builtin.command:
    argv: [cat, /etc/doas.conf]
  register: verify_doas_content
  changed_when: false

- name: Read the installed yay version
  ansible.builtin.command:
    argv: [yay, --version]
  register: verify_yay
  changed_when: false

# The packages role treats an AUR package that will not build after its whole
# retry budget as UPSTREAM_BROKEN: it reports the package and provisioning
# continues (roles/packages, aur_fail_hard defaults to false). Querying the
# full aur_packages list here contradicts that contract and kills an otherwise
# healthy run at the very last play, for the one failure mode the packages role
# already decided was survivable. So verify what provisioning actually promised
# to install, and account for the skipped remainder separately below.
# `default([])` covers a tags-limited run such as `--tags verification`, where
# the packages role never ran and never set the fact. Nothing was skipped from
# this play's point of view, so every AUR package is expected and a genuinely
# missing one still fails here.
- name: Record which AUR packages provisioning promised to install
  ansible.builtin.set_fact:
    verify_skipped_aur_packages: "{{ aur_skipped_packages | default([]) }}"
    verify_expected_aur_packages: >-
      {{ aur_packages | difference(aur_skipped_packages | default([])) }}

- name: Query all explicitly configured packages
  ansible.builtin.command:
    argv: >-
      {{ ['pacman', '-Q']
         + official_packages
         + verify_expected_aur_packages
         + docker_packages
         + ['ufw', 'fail2ban'] }}
  register: verify_packages
  changed_when: false

# Not an assertion: a skipped package is expected to be absent, but an earlier
# run may have installed it before upstream broke, so either answer is valid.
# This records which it is so the report below states it rather than guesses.
- name: Query the AUR packages that were skipped as unbuildable
  ansible.builtin.command:
    argv: "{{ ['pacman', '-Q'] + verify_skipped_aur_packages }}"
  register: verify_skipped_aur_query
  changed_when: false
  failed_when: false
  when: verify_skipped_aur_packages | length > 0

# base-devel is a meta package, not a group: `pacman -Si base-devel` reports
# "Groups: None", so `pacman -Qg base-devel` fails with "group not found".
# -Qi shows the installed version plus the toolchain it depends on, and pacman's
# own dependency resolution guarantees those deps are present.
- name: Show the installed base-devel meta package and its dependencies
  ansible.builtin.command:
    argv: [pacman, -Qi, base-devel]
  register: verify_base_devel
  changed_when: false

- name: Verify Docker access as liam
  ansible.builtin.command:
    argv: [runuser, --user, "{{ admin_user }}", --, docker, info]
  environment:
    HOME: "{{ admin_home }}"
  register: verify_docker_info
  changed_when: false

- name: Run the final hello-world container as liam
  ansible.builtin.command:
    argv: [runuser, --user, "{{ admin_user }}", --, docker, run, --rm, hello-world]
  environment:
    HOME: "{{ admin_home }}"
  register: verify_docker_hello
  changed_when: false

- name: Validate sshd syntax
  ansible.builtin.command:
    argv: [sshd, -t]
  register: verify_sshd_syntax
  changed_when: false

- name: Read the final effective sshd configuration
  ansible.builtin.command:
    argv: [sshd, -T]
  register: verify_sshd_effective
  changed_when: false

- name: Record the final SSH port
  ansible.builtin.set_fact:
    effective_ssh_port: >-
      {{ (verify_sshd_effective.stdout_lines
          | select('match', '(?i)^port ')
          | first).split()[1] | int }}

- name: Build the final controller-side SSH check
  ansible.builtin.set_fact:
    final_ssh_validation_argv: >-
      {{ ['ssh', '-F', '/dev/null', '-o', 'BatchMode=yes',
          '-o', 'ConnectTimeout=10', '-o', 'StrictHostKeyChecking=no',
          '-o', 'UserKnownHostsFile=/dev/null', '-p',
          (effective_ssh_port | string)]
         + (['-o', 'IdentitiesOnly=yes', '-i', ssh_validation_identity_file]
            if ssh_validation_identity_file | length > 0 else [])
         + [admin_user ~ '@' ~ ssh_validation_host, 'id'] }}

- name: Verify final fresh SSH key authentication as liam
  ansible.builtin.command:
    argv: "{{ final_ssh_validation_argv }}"
  delegate_to: localhost
  become: false
  register: verify_ssh_connection
  changed_when: false

- name: Read verbose UFW status
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  register: verify_ufw
  changed_when: false

- name: Read fail2ban sshd jail status
  ansible.builtin.command:
    argv: [fail2ban-client, status, sshd]
  register: verify_fail2ban
  changed_when: false

- name: Read fail2ban sshd jail actions
  ansible.builtin.command:
    argv: [fail2ban-client, get, sshd, actions]
  register: verify_fail2ban_actions
  changed_when: false

- name: Read fail2ban sshd ignore list
  ansible.builtin.command:
    argv: [fail2ban-client, get, sshd, ignoreip]
  register: verify_fail2ban_ignoreip
  changed_when: false

- name: Resolve key Stow targets through direct or folded links
  ansible.builtin.command:
    argv: [readlink, -f, "{{ item.target }}"]
  loop: "{{ stow_key_links }}"
  loop_control:
    label: "{{ item.target }}"
  register: verify_stow_links
  changed_when: false
  failed_when: false

# --- Bootable snapshots ------------------------------------------------------
# This play is a separate play from the one that runs the snapshots role, and a
# role's defaults do not survive into a later play, so they are loaded here
# explicitly. Loaded under a name rather than into the global namespace: a bare
# include_vars outranks group_vars, which would silently shadow any override the
# operator set there. Each value below therefore prefers whatever is already
# defined and falls back to the role default.
- name: Load the snapshot role defaults for this play
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/snapshots/defaults/main.yml"
    name: snapshot_role_defaults
  tags: [verification, snapshots]

- name: Resolve the snapshot settings to verify against
  ansible.builtin.set_fact:
    verify_snap_enabled: "{{ snapshots_enabled | default(snapshot_role_defaults.snapshots_enabled) }}"
    verify_snap_boot: "{{ snapshots_boot_integration | default(snapshot_role_defaults.snapshots_boot_integration) }}"
    verify_snap_machi: "{{ machi_enabled | default(snapshot_role_defaults.machi_enabled) }}"
    verify_snap_mountpoint: "{{ snapshots_mountpoint | default(snapshot_role_defaults.snapshots_mountpoint) }}"
    verify_snap_subvolume: "{{ snapshots_subvolume_name | default(snapshot_role_defaults.snapshots_subvolume_name) }}"
    verify_snap_config: "{{ snapshots_config_name | default(snapshot_role_defaults.snapshots_config_name) }}"
    verify_snap_grub_dir: "{{ snapshots_grub_dir | default(snapshot_role_defaults.snapshots_grub_dir) }}"
    verify_snap_generator: "{{ snapshots_grub_btrfs_generator | default(snapshot_role_defaults.snapshots_grub_btrfs_generator) }}"
    verify_snap_mkinitcpio: "{{ snapshots_mkinitcpio_conf | default(snapshot_role_defaults.snapshots_mkinitcpio_conf) }}"
    verify_snap_hook_name: "{{ snapshots_overlayfs_hook_name | default(snapshot_role_defaults.snapshots_overlayfs_hook_name) }}"
    verify_snap_machi_bin: "{{ machi_bin_path | default(snapshot_role_defaults.machi_bin_path) }}"
  tags: [verification, snapshots]

# Skipped rather than failed when the snapshots role is disabled, so a host
# provisioned with snapshots_enabled=false still passes verification.

- name: Check whether the snapshot store is mounted
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --output, "SOURCE,OPTIONS", --mountpoint, "{{ verify_snap_mountpoint }}"]
  register: verify_snapshot_store
  changed_when: false
  failed_when: false
  when: verify_snap_enabled | bool
  tags: [verification, snapshots]

- name: Read the snapper configuration in force
  ansible.builtin.command:
    argv: [snapper, --config, "{{ verify_snap_config }}", get-config]
  register: verify_snapper_config
  changed_when: false
  failed_when: false
  when: verify_snap_enabled | bool
  tags: [verification, snapshots]

- name: Read the snapshots that exist
  ansible.builtin.command:
    argv: [snapper, --config, "{{ verify_snap_config }}", list]
  register: verify_snapper_list
  changed_when: false
  failed_when: false
  when: verify_snap_enabled | bool
  tags: [verification, snapshots]

# The only place snap-pac looks for which configs to snapshot. Empty here means
# no pre-update snapshot is ever taken, and nothing reports an error.

- name: Read the snapper configurations registered for the pacman hooks
  ansible.builtin.command:
    argv: [grep, "^SNAPPER_CONFIGS=", /etc/conf.d/snapper]
  register: verify_snap_pac_configs
  changed_when: false
  failed_when: false
  when: verify_snap_enabled | bool
  tags: [verification, snapshots]

- name: Read the generated snapshot boot entries
  ansible.builtin.command:
    argv: [grep, -c, -e, "--class snapshots", "{{ verify_snap_grub_dir }}/grub-btrfs.cfg"]
  register: verify_snapshot_boot_entries
  changed_when: false
  failed_when: false
  when:
    - verify_snap_enabled | bool
    - verify_snap_boot | bool
  tags: [verification, snapshots, boot]

- name: Read the initramfs hooks that make a read-only snapshot bootable
  ansible.builtin.command:
    argv: [grep, "^HOOKS=", "{{ verify_snap_mkinitcpio }}"]
  register: verify_snapshot_hooks
  changed_when: false
  failed_when: false
  when:
    - verify_snap_enabled | bool
    - verify_snap_boot | bool
  tags: [verification, snapshots, boot]

- name: Read the machi snapshot commands
  ansible.builtin.command:
    argv: ["{{ verify_snap_machi_bin }}", snapshot, --help]
  register: verify_machi
  changed_when: false
  failed_when: false
  when: verify_snap_machi | bool
  tags: [verification, snapshots, machi]

- name: Assert the bootable snapshot system is in force
  ansible.builtin.assert:
    that:
      - (verify_snapshot_store.rc | default(1)) == 0
      - verify_snap_subvolume in (verify_snapshot_store.stdout | default(''))
      - "'SUBVOLUME' in (verify_snapper_config.stdout | default(''))"
      - verify_snap_config in (verify_snap_pac_configs.stdout | default(''))
      - (verify_machi.rc | default(1)) == 0 or not (verify_snap_machi | bool)
    fail_msg: >-
      The snapshot system is not fully in force. Store mount:
      {{ verify_snapshot_store.stdout | default('not mounted') }}. snap-pac
      configs: {{ verify_snap_pac_configs.stdout | default('unset') }}. See
      docs/snapshots.md.
  when: verify_snap_enabled | bool
  tags: [verification, snapshots, boot]

# Separate from the assertion above so the reason is specific: entries exist in
# grub-btrfs.cfg, the overlayfs hook is in the initramfs, and grub.cfg sources
# the submenu. Only meaningful once at least one snapshot exists.

- name: Assert snapshots are actually bootable
  ansible.builtin.assert:
    that:
      - verify_snap_hook_name in (verify_snapshot_hooks.stdout | default(''))
      - (verify_snapshot_boot_entries.stdout | default('0') | trim | int) > 0
    fail_msg: >-
      Snapshots exist but are not bootable.
      HOOKS: {{ verify_snapshot_hooks.stdout | default('unknown') }}.
      Boot entries in {{ verify_snap_grub_dir }}/grub-btrfs.cfg:
      {{ verify_snapshot_boot_entries.stdout | default('0') | trim }}.
      Regenerate with `sudo {{ verify_snap_generator }}`; see the
      boot-menu troubleshooting in docs/snapshots.md.
  when:
    - verify_snap_enabled | bool
    - verify_snap_boot | bool
    - (verify_snapper_list.stdout_lines | default([]) | length) > 3
  tags: [verification, snapshots, boot]

- name: Assert final user, services, hardening, and Stow state
  ansible.builtin.assert:
    that:
      - "'wheel' in verify_id.stdout"
      - "'docker' in verify_id.stdout"
      - "verify_sudoers_content.stdout == admin_user ~ ' ALL=(ALL:ALL) ALL'"
      - verify_doas_content.stdout == 'permit persist ' ~ admin_user ~ ' as root'
      - "'Status: active' in verify_ufw.stdout"
      - (effective_ssh_port | string) in verify_ufw.stdout
      - "'Status for the jail: sshd' in verify_fail2ban.stdout"
      - "'nftables-multiport' in verify_fail2ban_actions.stdout"
      - admin_ips | reject('in', verify_fail2ban_ignoreip.stdout) | list | length == 0
      - "'permitrootlogin no' in (verify_sshd_effective.stdout_lines | map('lower'))"
      - "'passwordauthentication no' in (verify_sshd_effective.stdout_lines | map('lower'))"
      - "'pubkeyauthentication yes' in (verify_sshd_effective.stdout_lines | map('lower'))"

- name: Assert every key Stow path resolves to its repository source
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout == item.item.source
    fail_msg: "Bad Stow link: {{ item.item.target }}"
  loop: "{{ verify_stow_links.results }}"
  loop_control:
    label: "{{ item.item.target }}"

- name: Print the final role check table
  ansible.builtin.debug:
    msg: |
      STATUS: {{ 'PASS' if verify_skipped_aur_packages | length == 0
                 else 'PASS WITH SKIPPED AUR PACKAGES' }}
      role         checks                                                     result
      users       liam exists; wheel and docker groups; sudoers valid        PASS
      privilege   doas.conf parses and matches the managed rule               PASS
      packages    official, AUR, base-devel, yay                             {{
        'PASS'
        if verify_skipped_aur_packages | length == 0
        else 'PASS (' ~ (verify_skipped_aur_packages | length) ~
             ' AUR package(s) skipped by the packages role, not verified)' }}
      docker      unprivileged info and hello-world                           PASS
      dotfiles    key Stow symlinks resolve to ~/dotfiles                     PASS
      ssh         syntax, effective policy, fresh liam key connection         PASS
      ufw         active; rate-limited configured SSH port present            PASS
      fail2ban    sshd jail active with nftables action                       PASS
      snapshots   snapper config, {{ verify_snap_subvolume }} store mounted, snap-pac registered   {{
        'PASS' if verify_snap_enabled | bool else 'SKIPPED (snapshots_enabled=false)' }}
      boot        {{ verify_snapshot_boot_entries.stdout | default('0') | trim }} snapshot entries in grub-btrfs.cfg; overlayfs hook in HOOKS   {{
        'PASS'
        if (verify_snap_enabled | bool and verify_snap_boot | bool)
        else 'SKIPPED' }}
      machi       machi snapshot create/list/cleanup available                {{
        'PASS' if verify_snap_machi | bool else 'SKIPPED (machi_enabled=false)' }}

# Last task of the run, so the skipped packages are the final thing on screen
# rather than something buried mid-play by the packages role hundreds of lines
# earlier. Verification passing must never let a missing package go unnoticed.
- name: Restate the unverified AUR packages as the last word of the run
  ansible.builtin.debug:
    msg: >-
      {{ ['*** VERIFICATION PASSED, BUT ' ~ (verify_skipped_aur_packages | length) ~
          ' AUR PACKAGE(S) ARE NOT INSTALLED ***']
         + (verify_skipped_aur_packages
            | map('regex_replace', '^(.+)$',
                  '  \1: skipped by the packages role as unbuildable; install later with: yay -S \1')
            | list)
         + ['pacman -Q for those packages reported: ' ~
            ((verify_skipped_aur_query.stderr | default('')) ~ ' ' ~
             (verify_skipped_aur_query.stdout | default('')) | trim),
            'Everything else in official_packages, aur_packages, docker_packages, ufw and fail2ban is installed and verified.',
            'Set aur_fail_hard=true to make an unbuildable AUR package stop provisioning instead.'] }}
  when: verify_skipped_aur_packages | length > 0

- name: Print actual verification command output
  ansible.builtin.debug:
    msg: |
      $ id {{ admin_user }}
      {{ verify_id.stdout }}

      $ visudo -cf /etc/sudoers
      {{ verify_sudoers.stdout }}

      $ cat /etc/sudoers.d/{{ admin_user }}
      {{ verify_sudoers_content.stdout }}

      $ doas -C /etc/doas.conf
      rc={{ verify_doas.rc }}

      $ cat /etc/doas.conf
      {{ verify_doas_content.stdout }}

      $ yay --version
      {{ verify_yay.stdout }}

      $ pacman -Q <configured packages>
      configured official={{ official_packages | join(' ') }}
      configured AUR={{ aur_packages | join(' ') }}
      verified AUR={{ verify_expected_aur_packages | join(' ') | default('none', true) }}
      skipped AUR={{ verify_skipped_aur_packages | join(' ') | default('none', true) }}
      {{ verify_packages.stdout }}

      $ pacman -Qi base-devel
      {{ verify_base_devel.stdout }}

      $ docker info  # become_user={{ admin_user }}
      {{ verify_docker_info.stdout }}

      $ docker run --rm hello-world  # become_user={{ admin_user }}
      {{ verify_docker_hello.stdout }}

      $ sshd -t
      rc={{ verify_sshd_syntax.rc }} stdout={{ verify_sshd_syntax.stdout | default('') }}

      $ sshd -T  # managed settings only
      {{ verify_sshd_effective.stdout_lines
         | select('match', '(?i)^(port|permitrootlogin|passwordauthentication|pubkeyauthentication|kbdinteractiveauthentication|maxauthtries|x11forwarding|allowagentforwarding|clientaliveinterval|clientalivecountmax) ')
         | join('\n') }}

      $ {{ final_ssh_validation_argv | join(' ') }}
      {{ verify_ssh_connection.stdout }}

      $ ufw status verbose
      {{ verify_ufw.stdout }}

      $ fail2ban-client status sshd
      {{ verify_fail2ban.stdout }}

      $ fail2ban-client get sshd actions
      {{ verify_fail2ban_actions.stdout }}

      $ fail2ban-client get sshd ignoreip
      {{ verify_fail2ban_ignoreip.stdout }}

      Verified Stow symlinks:
      {{ verify_stow_links.results
         | map(attribute='item.target')
         | join('\n') }}

      Password:
      {{ 'vault hash is applied by the final task of this play'
         if admin_password_hash | length > 0
         else 'skipped; vault_liam_password_hash was not supplied' }}
